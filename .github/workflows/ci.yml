name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - name: Generate data and train matcher
        run: |
          PYTHONPATH=src python -m mdq.generate
          PYTHONPATH=src python -m mdq.invoices
          python scripts/train_matcher.py
      - run: pytest -q
      - name: Matching metrics (regression guard)
        run: python eval/eval_matching.py
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Generate data
        run: pip install pandas numpy && PYTHONPATH=src python -m mdq.generate
      - run: docker build -t genai-mdq .
      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 --name api genai-mdq
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf -X POST localhost:8000/validate -H 'Content-Type: application/json' \
            -d '{"records":[{"name":"Construcciones Garcia SL","cif":"B12345674"}]}'
